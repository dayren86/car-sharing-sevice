databaseChangeLog:
  - changeSet:
      id: create-rental-table
      author: andrey
      changes:
        - createTable:
            tableName: rentals
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: rental_date
                  type: datetime
              - column:
                  name: return_date
                  type: datetime
              - column:
                  name: actual_return_date
                  type: datetime
              - column:
                  name: last_notification_sent
                  type: datetime
              - column:
                  name: is_active
                  type: bit
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: car_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_car_id
                    references: cars(id)
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_user_id
                    references: users(id)
                    nullable: false
              - column:
                  name: is_deleted
                  type: bit
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
