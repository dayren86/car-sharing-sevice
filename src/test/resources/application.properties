spring.application.name=${APPLICATION_NAME}
spring.datasource.url=jdbc:tc:mysql:8.2.0:///${DATABASE_NAME}?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.config.import=optional:file:.env[.properties]

jwt.expiration=${JWT_EXPIRATION}
jwt.secret=${JWT_SECRET}

telegram.token=${TELEGRAM_TOKEN}

stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret={STRIPE_WEBHOOK_SECRET}

payment.scheduler.interval=${PAYMENT_SCHEDULER_INTERVAL}
rental.scheduler.interval=${RENTAL_SCHEDULER_INTERVAL}
rental.scheduler.message.repeat=${RENTAL_SCHEDULER_MESSAGE_REPEAT}
